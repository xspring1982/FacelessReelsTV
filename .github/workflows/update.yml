name: Weekly update

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after Radar's weekly crawl
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data
          git diff --cached --quiet || git commit -m "Weekly update from facelessreels.tv"
          git push
